services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: web-runner
    restart: always
    networks:
      - sitehaus-network

  dashboard:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: dashboard-runner
    restart: always
    networks:
      - sitehaus-network

  iam:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: iam-runner
    restart: always
    networks:
      - sitehaus-network

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: api-runner
    restart: always
    env_file:
      - ./apps/api/.env
    networks:
      - sitehaus-network

  caddy:
    image: caddy:2.10.0-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sitehaus-network
    env_file:
      - .env
    depends_on:
      - web
      - dashboard
      - iam

networks:
  sitehaus-network:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
