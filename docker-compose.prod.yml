services:
  postgres:
    image: postgres:17-alpine
    restart: always
    networks:
      - sitehaus-network
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  web:
    image: ghcr.io/sitehaus/sitehaus-web:latest
    restart: always
    env_file:
      - ./apps/web/.env
    networks:
      - sitehaus-network

  dashboard:
    image: ghcr.io/sitehaus/sitehaus-dashboard:latest
    restart: always
    networks:
      - sitehaus-network

  iam:
    image: ghcr.io/sitehaus/sitehaus-iam:latest
    restart: always
    networks:
      - sitehaus-network

  commerce:
    image: ghcr.io/sitehaus/sitehaus-commerce:latest
    restart: always
    env_file:
      - ./apps/commerce/.env
    networks:
      - sitehaus-network

  api:
    image: ghcr.io/sitehaus/sitehaus-api:latest
    restart: always
    env_file:
      - ./apps/api/.env
    networks:
      - sitehaus-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  lighthaus:
    image: ghcr.io/sitehaus/sitehaus-lighthaus:latest
    restart: always
    networks:
      - sitehaus-network

  lighthaus-api:
    image: ghcr.io/sitehaus/sitehaus-lighthaus-api:latest
    restart: always
    env_file:
      - ./apps/lighthaus-api/.env
    ports:
      - "3007:3007"
    networks:
      - sitehaus-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot Drizzle migration runner. Not part of `up` (profile-gated) — CD runs
  # `docker compose run --rm migrate` after postgres is healthy and before the
  # apps boot. Lives on the network so it can reach postgres (which has no host
  # port); reuses lighthaus-api's env for DATABASE_URL.
  migrate:
    profiles: ["migrate"]
    image: node:20-alpine
    restart: "no"
    working_dir: /repo/packages/db
    volumes:
      - ./:/repo
    env_file:
      - ./apps/lighthaus-api/.env
    networks:
      - sitehaus-network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - "corepack enable && corepack prepare pnpm@10.14.0 --activate && pnpm install --filter @site-haus/db... --frozen-lockfile && pnpm --filter @site-haus/db db:migrate"

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - sitehaus-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.10.0-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sitehaus-network
    env_file:
      - .env
    depends_on:
      - web
      - dashboard
      - iam
      - commerce
      - api

networks:
  sitehaus-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  redis_data:
    driver: local
