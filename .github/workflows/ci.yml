name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.sitehaus.dev
      NEXT_PUBLIC_CLIENT_KEY: iam
      # apps/lighthaus requires these at build time (module-scope env guards)
      NEXT_PUBLIC_LIGHTHAUS_API_URL: https://lighthaus-api.sitehaus.dev
      NEXT_PUBLIC_IAM_URL: https://iam.sitehaus.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Run type-check, lint, and build in parallel via Turborepo
      - name: Type check, Lint, and Build
        run: pnpm turbo run check-types lint build --cache-dir=.turbo
