name: CD

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      API_URL: https://api.sitehaus.dev
      CLIENT_KEY: dummy-ci-client-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm turbo run check-types --cache-dir=.turbo

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VULTR_IP }}
          username: deploy
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -euo pipefail

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            cd /srv/sitehaus

            git pull origin main

            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
