name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sitehaus/sitehaus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push all 4 images from the same build
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web-runner
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.sitehaus.dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: dashboard-runner
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-dashboard:latest
            ${{ env.IMAGE_PREFIX }}-dashboard:${{ github.sha }}
          cache-from: type=gha

      - name: Build and push iam
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: iam-runner
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-iam:latest
            ${{ env.IMAGE_PREFIX }}-iam:${{ github.sha }}
          cache-from: type=gha

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api-runner
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha

  deploy:
    needs: build-and-push
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VULTR_IP }}
          username: deploy
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /srv/sitehaus

            git pull origin main

            # Pull pre-built images
            docker compose -f docker-compose.prod.yml pull

            # Deploy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Cleanup
            docker image prune -f
