name: CD

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm turbo run check-types --cache-dir=.turbo

      - name: Build workspace
        run: pnpm turbo run build --cache-dir=.turbo

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            sudo mkdir -p /var/www/sitehaus
            cd /var/www/sitehaus || exit 1
            if [ ! -d .git ]; then
              git clone --depth 1 https://github.com/SiteHaus/sitehaus.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            bash infra/create_network.sh
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
