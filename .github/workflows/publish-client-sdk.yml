name: Publish Client SDK

on:
  push:
    tags:
      - "client-sdk-v*"

concurrency:
  group: publish-client-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@sitehaus/client-sdk --cache-dir=.turbo

      - name: Extract version from tag
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: echo "VERSION=${GIT_REF#refs/tags/client-sdk-v}" >> $GITHUB_OUTPUT

      - name: Verify version matches package.json
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PKG_VERSION=$(node -p "require('./packages/client-sdk/package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Publish
        working-directory: packages/client-sdk
        run: npm publish --access public --provenance
