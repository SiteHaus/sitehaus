services:
  postgres:
    image: postgres:17-alpine
    restart: always
    networks:
      - sitehaus-network
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    ports:
      - "127.0.0.1:5432:5432"
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - sitehaus-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  api:
    image: ghcr.io/sitehaus/sitehaus-api:staging
    restart: always
    networks:
      - sitehaus-network
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web:
    image: ghcr.io/sitehaus/sitehaus-web:staging
    restart: always
    networks:
      - sitehaus-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  dashboard:
    image: ghcr.io/sitehaus/sitehaus-dashboard:staging
    restart: always
    networks:
      - sitehaus-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  iam:
    image: ghcr.io/sitehaus/sitehaus-iam:staging
    restart: always
    networks:
      - sitehaus-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile.staging:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sitehaus-network
    depends_on:
      - api
      - web
      - dashboard
      - iam
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  sitehaus-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
